<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS CRISTIANO RONALDO THE GOAT? 🐐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated background with neon grid */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(0deg, transparent 24%, rgba(255, 0, 0, 0.05) 25%, rgba(255, 0, 0, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 0, 0.05) 75%, rgba(255, 0, 0, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(255, 0, 0, 0.05) 25%, rgba(255, 0, 0, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 0, 0.05) 75%, rgba(255, 0, 0, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            animation: gridPulse 4s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Neon glow effects */
        .neon-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 0, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* Ronaldo image container */
        .ronaldo-image {
            width: clamp(180px, 25vh, 300px);
            height: clamp(180px, 25vh, 300px);
            margin-bottom: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ff0000;
            box-shadow: 
                0 0 40px rgba(255, 0, 0, 0.8),
                0 0 80px rgba(255, 0, 0, 0.5),
                inset 0 0 40px rgba(255, 0, 0, 0.2);
            animation: imageGlow 3s ease-in-out infinite;
            position: relative;
            flex-shrink: 0;
        }

        @keyframes imageGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 40px rgba(255, 0, 0, 0.8),
                    0 0 80px rgba(255, 0, 0, 0.5),
                    inset 0 0 40px rgba(255, 0, 0, 0.2);
            }
            50% { 
                box-shadow: 
                    0 0 60px rgba(255, 0, 0, 1),
                    0 0 120px rgba(255, 0, 0, 0.8),
                    inset 0 0 60px rgba(255, 0, 0, 0.4);
            }
        }

        .ronaldo-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Main question */
        .question {
            font-size: clamp(1.5rem, 3.5vh, 2.5rem);
            text-align: center;
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 30px #ff0000,
                0 0 40px #ff0000;
            animation: neonFlicker 2s infinite alternate;
            line-height: 1.3;
            max-width: 900px;
            flex-shrink: 0;
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 30px #ff0000,
                    0 0 40px #ff0000,
                    0 0 50px #ff0000;
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }

        /* Buttons container */
        .buttons {
            display: flex;
            gap: 30px;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            max-width: 600px;
            flex-shrink: 0;
        }

        /* YES button */
        .btn-yes {
            padding: 15px 50px;
            font-size: clamp(1.2rem, 2.5vh, 1.8rem);
            font-weight: bold;
            text-transform: uppercase;
            border: 3px solid #ff0000;
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: #fff;
            cursor: pointer;
            border-radius: 10px;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 20px rgba(255, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 0, 0, 0.2);
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 
                0 0 40px rgba(255, 0, 0, 0.8),
                inset 0 0 30px rgba(255, 0, 0, 0.4);
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        /* NO button */
        .btn-no {
            padding: 15px 50px;
            font-size: clamp(1.2rem, 2.5vh, 1.8rem);
            font-weight: bold;
            text-transform: uppercase;
            border: 3px solid #666;
            background: linear-gradient(45deg, #333, #555);
            color: #999;
            cursor: pointer;
            border-radius: 10px;
            position: relative;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
            z-index: 10;
            flex-shrink: 0;
        }

        .btn-no.escaping {
            position: fixed;
        }

        /* Celebration overlay */
        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.5s ease;
        }

        .celebration.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .celebration-content {
            text-align: center;
            padding: 20px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .celebration-image {
            width: clamp(200px, 30vh, 350px);
            height: clamp(200px, 30vh, 350px);
            margin: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #ff0000;
            box-shadow: 
                0 0 60px rgba(255, 0, 0, 1),
                0 0 120px rgba(255, 0, 0, 0.8),
                inset 0 0 60px rgba(255, 0, 0, 0.4);
            animation: victoryGlow 1s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes victoryGlow {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 0 60px rgba(255, 0, 0, 1),
                    0 0 120px rgba(255, 0, 0, 0.8),
                    inset 0 0 60px rgba(255, 0, 0, 0.4);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 
                    0 0 80px rgba(255, 0, 0, 1),
                    0 0 160px rgba(255, 0, 0, 1),
                    inset 0 0 80px rgba(255, 0, 0, 0.6);
            }
        }

        .celebration-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .celebration h1 {
            font-size: clamp(1.8rem, 4vh, 3.5rem);
            margin-bottom: 0;
            color: #ff0000;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 60px #ff0000;
            animation: celebrationPulse 1s ease-in-out infinite;
        }

        @keyframes celebrationPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .celebration p {
            font-size: clamp(1.2rem, 2.5vh, 2rem);
            margin: 10px 0;
            text-shadow: 0 0 10px #ff0000;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff0000;
            position: absolute;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .buttons {
                gap: 15px;
            }

            .btn-yes, .btn-no {
                padding: 12px 35px;
            }
        }

        @media (max-width: 480px) {
            .question {
                font-size: 1.3rem;
                letter-spacing: 1px;
            }

            .btn-yes, .btn-no {
                padding: 10px 25px;
                font-size: 1.1rem;
            }

            .buttons {
                gap: 10px;
            }
        }

        @media (max-height: 700px) {
            .ronaldo-image {
                width: 150px;
                height: 150px;
            }

            .question {
                font-size: 1.5rem;
            }

            .btn-yes, .btn-no {
                padding: 10px 30px;
                font-size: 1.2rem;
            }

            .celebration-image {
                width: 180px;
                height: 180px;
            }

            .celebration h1 {
                font-size: 1.8rem;
            }

            .celebration p {
                font-size: 1.2rem;
            }
        }

        /* Flashing border effect */
        @keyframes borderFlash {
            0%, 100% { border-color: #ff0000; }
            50% { border-color: #ff6666; }
        }

        .celebration.active {
            animation: borderFlash 0.5s infinite;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="neon-overlay"></div>

    <div class="container">
        <div class="ronaldo-image">
            <img src="cr7.jpg" alt="Cristiano Ronaldo">
        </div>

        <h1 class="question">IS CRISTIANO RONALDO THE GOAT? 🐐</h1>

        <div class="buttons">
            <button class="btn-yes" id="yesBtn">YES ✓</button>
            <button class="btn-no" id="noBtn">NO ✗</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-image">
                <img src="cr7inside.jpg" alt="Cristiano Ronaldo GOAT">
            </div>
            <h1>CORRECT ANSWER! SIUUUUUU! 🐐🐐</h1>
            <p>THERE IS NO DEBATE.</p>
            <p>THE GOAT IS CRISTIANO RONALDO!</p>
            <p style="font-size: 4rem;">⚽🏆👑</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const celebration = document.getElementById('celebration');
        
        let isEscaping = false;
        let hasEscaped = false;

        // Function to get random position within viewport
        function getRandomPosition() {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;
            
            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);
            
            return { x, y };
        }

        // Function to move NO button
        function moveNoButton() {
            if (isEscaping) return;
            
            if (!hasEscaped) {
                hasEscaped = true;
                noBtn.classList.add('escaping');
            }
            
            isEscaping = true;
            const pos = getRandomPosition();
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = pos.x + 'px';
            noBtn.style.top = pos.y + 'px';
            
            setTimeout(() => {
                isEscaping = false;
            }, 200);
        }

        // Check distance between mouse and NO button
        function checkDistance(mouseX, mouseY) {
            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;
            
            const distance = Math.sqrt(
                Math.pow(mouseX - btnCenterX, 2) + 
                Math.pow(mouseY - btnCenterY, 2)
            );
            
            // Escape distance threshold (pixels)
            const threshold = 150;
            
            if (distance < threshold) {
                moveNoButton();
            }
        }

        // Mouse move event
        document.addEventListener('mousemove', (e) => {
            checkDistance(e.clientX, e.clientY);
        });

        // Touch move event for mobile
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            checkDistance(touch.clientX, touch.clientY);
        });

        // NO button hover/touch event (extra protection)
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Attempt to click NO button (just in case someone is lucky)
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // YES button click
        yesBtn.addEventListener('click', () => {
            celebration.classList.add('active');
            createConfetti();
            
            // Play celebration animation
            setTimeout(() => {
                document.body.style.animation = 'borderFlash 0.3s infinite';
            }, 100);
        });

        // Create confetti effect
        function createConfetti() {
            const colors = ['#ff0000', '#ffff00', '#00ff00', '#0000ff', '#ff00ff', '#ffffff'];
            const confettiCount = 100;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }, i * 30);
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            // NO button starts in normal position, only becomes fixed when it escapes
        });

        // Prevent NO button from being selected or dragged
        noBtn.addEventListener('selectstart', (e) => e.preventDefault());
        noBtn.addEventListener('dragstart', (e) => e.preventDefault());
    </script>
</body>
</html>
